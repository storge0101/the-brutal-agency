kind = "web"
previewPath = "/"
title = "The Brutal Agency"
version = "1.0.0"
id = "artifacts/brutal-agency"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25369
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/brutal-agency run dev"

[services.env]
PORT = "25369"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/brutal-agency", "run", "build"]
publicDir = "artifacts/brutal-agency/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
